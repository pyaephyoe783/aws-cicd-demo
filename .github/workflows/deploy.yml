name: Deploy via AWS OIDC (No Access Keys)

on:
  push:
    branches: [ "main" ]

# 1. OIDC Token ရယူရန် Permission ပေးရမည်
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Access Keys များ အစား OIDC Role ARN ကို သုံးသည်
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActions-SSM-OIDC-Role   # မိမိ IAM Role ARN ပြောင်းပါ
          aws-region: ap-southeast-1

      - name: Execute Deployment via SSM
        run: |
          aws ssm send-command \
            --instance-ids "YOUR_EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "mkdir -p /home/ubuntu/aws-cicd-demo",
              "cd /home/ubuntu/aws-cicd-demo",
              "git config --global --add safe.directory *",
              "if [ ! -d .git ]; then git init && git remote add origin https://github.com/YOUR_USERNAME/aws-cicd-demo.git; fi",
              "git fetch origin main",
              "git reset --hard origin/main",
              "sudo cp -f index.html /var/www/html/index.html"
            ]'






            