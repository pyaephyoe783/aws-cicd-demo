name: Production Private Deploy via AWS SSM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # မိမိ EC2 တည်ရှိသော Region အတိအကျ ပေးပါ

      - name: Deploy via AWS Systems Manager (SSM)
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo git config --global --add safe.directory *",
              "if [ ! -d \"/home/ubuntu/aws-cicd-demo\" ]; then sudo git clone https://github.com/YOUR_USERNAME/aws-cicd-demo.git /home/ubuntu/aws-cicd-demo; fi",
              "cd /home/ubuntu/aws-cicd-demo",
              "sudo git fetch --all",
              "sudo git reset --hard origin/main",
              "sudo cp -f index.html /var/www/html/index.html",
              "sudo systemctl restart nginx"
            ]'