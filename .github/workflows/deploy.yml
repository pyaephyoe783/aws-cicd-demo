name: Deploy via AWS OIDC (No Access Keys)

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          # 1. AWS Account ID အစစ် 227220817151 ကို ပြောင်းထားပါသည်
          role-to-assume: arn:aws:iam::227220817151:role/GitHubActions-SSM-OIDC-Role
          # 2. Screenshot 105 အရ Region ကို us-east-1 သို့ ပြောင်းထားပါသည်
          aws-region: us-east-1

      - name: Execute Deployment via SSM
        run: |
          aws ssm send-command \
            --instance-ids "i-0b3d35482afeb998d" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "mkdir -p /home/ubuntu/aws-cicd-demo",
              "cd /home/ubuntu/aws-cicd-demo",
              "git config --global --add safe.directory *",
              "if [ ! -d .git ]; then git init && git remote add origin https://github.com/pyaephyoe783/aws-cicd-demo.git; fi",
              "git fetch origin main",
              "git reset --hard origin/main",
              "sudo cp -f index.html /var/www/html/index.html"
            ]'

            